# Adds namespace to all resources.
namespace: capt-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "appthrust-capt-wordpress".
namePrefix: appthrust-capt-
nameSuffix: -infrastructure

resources:
- bases/infrastructure.cluster.x-k8s.io_captclusters.yaml
- bases/infrastructure.cluster.x-k8s.io_captmachinedeployments.yaml
- bases/infrastructure.cluster.x-k8s.io_captmachines.yaml
- bases/infrastructure.cluster.x-k8s.io_captmachinesets.yaml
- bases/infrastructure.cluster.x-k8s.io_captmachinetemplates.yaml
- bases/infrastructure.cluster.x-k8s.io_captclustertemplates.yaml
- bases/infrastructure.cluster.x-k8s.io_workspacetemplateapplies.yaml
- bases/infrastructure.cluster.x-k8s.io_workspacetemplates.yaml

commonLabels:
  cluster.x-k8s.io/provider: infrastructure-capt

patches:
  # Ensure CAPI contract label is present on provider CRDs so ClusterClass contract resolution works after cluster re-creation
  - target:
      version: v1
      kind: CustomResourceDefinition
      name: captclustertemplates.infrastructure.cluster.x-k8s.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: captclustertemplates.infrastructure.cluster.x-k8s.io
        labels:
          cluster.x-k8s.io/v1beta1: v1beta1
  - target:
      version: v1
      kind: CustomResourceDefinition
      name: captmachinetemplates.infrastructure.cluster.x-k8s.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: captmachinetemplates.infrastructure.cluster.x-k8s.io
        labels:
          cluster.x-k8s.io/v1beta1: v1beta1
  - target:
      version: v1
      kind: CustomResourceDefinition
      name: captclusters.infrastructure.cluster.x-k8s.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: captclusters.infrastructure.cluster.x-k8s.io
        labels:
          cluster.x-k8s.io/v1beta1: v1beta1
  - target:
      version: v1
      kind: CustomResourceDefinition
      name: captmachines.infrastructure.cluster.x-k8s.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: captmachines.infrastructure.cluster.x-k8s.io
        labels:
          cluster.x-k8s.io/v1beta1: v1beta1
  - target:
      version: v1
      kind: CustomResourceDefinition
      name: captmachinesets.infrastructure.cluster.x-k8s.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: captmachinesets.infrastructure.cluster.x-k8s.io
        labels:
          cluster.x-k8s.io/v1beta1: v1beta1
  - target:
      version: v1
      kind: CustomResourceDefinition
      name: captmachinedeployments.infrastructure.cluster.x-k8s.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: captmachinedeployments.infrastructure.cluster.x-k8s.io
        labels:
          cluster.x-k8s.io/v1beta1: v1beta1
  - target:
      version: v1
      kind: CustomResourceDefinition
      name: workspacetemplates.infrastructure.cluster.x-k8s.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: workspacetemplates.infrastructure.cluster.x-k8s.io
        labels:
          cluster.x-k8s.io/v1beta1: v1beta1
  - target:
      version: v1
      kind: CustomResourceDefinition
      name: workspacetemplateapplies.infrastructure.cluster.x-k8s.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: workspacetemplateapplies.infrastructure.cluster.x-k8s.io
        labels:
          cluster.x-k8s.io/v1beta1: v1beta1
