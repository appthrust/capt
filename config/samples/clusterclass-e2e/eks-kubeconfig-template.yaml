apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: WorkspaceTemplate
metadata:
  name: eks-kubeconfig-template
  namespace: default
spec:
  template:
    metadata:
      description: "No-Op kubeconfig generator (no AWS CLI)"
      version: "0.0.1"
      tags:
        provider: "noop"
        resource: "kubeconfig"
    spec:
      providerConfigRef:
        name: noop-provider-config
      forProvider:
        source: Inline
        enableTerraformCLILogging: false
        vars:
          - key: cluster_name
            value: "${cluster_name}"
          - key: region
            value: "${region}"
          - key: cluster_endpoint
            value: "${cluster_endpoint}"
          - key: cluster_certificate_authority_data
            value: "${cluster_certificate_authority_data}"
        module: |
          variable "cluster_name" { type = string }
          variable "region" { type = string }
          variable "cluster_endpoint" { type = string }
          variable "cluster_certificate_authority_data" { type = string }

          # Generate a simple kubeconfig with a static token
          output "kubeconfig" {
            value = <<-EOT
            apiVersion: v1
            clusters:
            - cluster:
                certificate-authority-data: ${var.cluster_certificate_authority_data}
                server: ${var.cluster_endpoint}
              name: ${var.cluster_name}.${var.region}.local
            contexts:
            - context:
                cluster: ${var.cluster_name}.${var.region}.local
                user: test-user@${var.cluster_name}.${var.region}.local
              name: test-user@${var.cluster_name}.${var.region}.local
            current-context: test-user@${var.cluster_name}.${var.region}.local
            kind: Config
            preferences: {}
            users:
            - name: test-user@${var.cluster_name}.${var.region}.local
              user:
                token: "dummy-token"
            EOT
            sensitive = true
          }


