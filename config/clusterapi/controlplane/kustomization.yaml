# Adds namespace to all resources.
namespace: capt-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "appthrust-capt-wordpress".
namePrefix: appthrust-capt-
nameSuffix: -control-plane

resources:
- bases/controlplane.cluster.x-k8s.io_captcontrolplanes.yaml
- bases/controlplane.cluster.x-k8s.io_captcontrolplanetemplates.yaml

commonLabels:
  cluster.x-k8s.io/provider: control-plane-capt

patches:
  # Ensure CAPI contract label is present on provider CRDs so ClusterClass contract resolution works after cluster re-creation
  - target:
      version: v1
      kind: CustomResourceDefinition
      name: captcontrolplanetemplates.controlplane.cluster.x-k8s.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: captcontrolplanetemplates.controlplane.cluster.x-k8s.io
        labels:
          cluster.x-k8s.io/v1beta1: v1beta1
  - target:
      version: v1
      kind: CustomResourceDefinition
      name: captcontrolplanes.controlplane.cluster.x-k8s.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: captcontrolplanes.controlplane.cluster.x-k8s.io
        labels:
          cluster.x-k8s.io/v1beta1: v1beta1
