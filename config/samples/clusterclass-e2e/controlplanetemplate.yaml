apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: CAPTControlPlaneTemplate
metadata:
  name: cp-noop-template
  namespace: default
spec:
  template:
    spec:
      version: "v1.31.0"
      workspaceTemplateRef:
        name: noop-template
        namespace: default
      controlPlaneConfig:
        region: "ap-northeast-1"
        endpointAccess:
          public: true
          private: false
      controlPlaneEndpoint:
        host: 127.0.0.1
        port: 6443
      additionalTags:
        Environment: ${cluster_environment}

