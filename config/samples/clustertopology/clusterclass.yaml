apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: eks-class
  namespace: default
spec:
  controlPlane:
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: CaptControlPlaneTemplate
      name: eks-control-plane-template
      namespace: default
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: CAPTClusterTemplate
      name: eks-cluster-class-template
      namespace: default
  workers:
    machineDeployments:
      - class: default-worker
        template:
          bootstrap:
            ref:
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
              kind: KubeadmConfigTemplate
              name: capt-default-worker-bootstrap
              namespace: default
          infrastructure:
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
              kind: CAPTMachineTemplate
              name: eks-node-template
              namespace: default
  variables:
    - name: controlPlane.endpointAccess.public
      required: true
      schema:
        openAPIV3Schema:
          type: boolean
          default: true
    - name: controlPlane.endpointAccess.private
      required: true
      schema:
        openAPIV3Schema:
          type: boolean
          default: true
    - name: cluster.environment
      required: true
      schema:
        openAPIV3Schema:
          type: string
          enum: ["dev", "staging", "prod"]
          default: "dev"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: CAPTClusterTemplate
metadata:
  name: eks-cluster-class-template
  namespace: default
spec:
  template:
    spec:
      region: "us-east-1"
      vpcTemplateRef:
        name: "vpc-template"
        namespace: "default"
